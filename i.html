<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mood-Based Content Curator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1><strong>Content Curator</strong></h1>
    <p>Discover content tailored to your mood!</p>
  </header>

  <main>
    <div class="mood-selector">
      <button data-mood="happy">😊 Happy</button>
      <button data-mood="sad">😢 Sad</button>
      <button data-mood="relaxed">🌿 Relaxed</button>
      <button data-mood="angry">😡 Angry</button>
      <button data-mood="anxious">😰 Anxious</button>
      <button data-mood="overwhelmed">😵 Overwhelmed</button>
      <button data-mood="lonely">💔 Lonely</button>
    </div>

    <section id="content" class="fade-in">
      <p>Select a mood to see curated recommendations!</p>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Mood Curator. All rights reserved.</p>
  </footer>

  <script src="script.js"></script>
</body>
